<button
	type="button"
	(click)="themeService.toggleTheme()"
	class="hover:text-blue-500 dark:text-zinc-300 dark:hover:text-blue-400 transition-colors cursor-pointer flex items-center justify-center p-0 leading-none bg-transparent border-0 text-zinc-800"
	[attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
	[title]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
>
	@if (themeService.isDarkMode()) {
		<svg
			xmlns="http://www.w3.org/2000/svg"
			width="20"
			height="20"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="1.5"
			stroke-linecap="round"
			stroke-linejoin="round"
			class="icon icon-tabler icon-tabler-sun"
		>
			<path stroke="none" d="M0 0h24v24H0z" fill="none"/>
			<path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
			<path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
		</svg>
	} @else {
		<svg
			xmlns="http://www.w3.org/2000/svg"
			width="20"
			height="20"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="1.5"
			stroke-linecap="round"
			stroke-linejoin="round"
			class="icon icon-tabler icon-tabler-moon"
		>
			<path stroke="none" d="M0 0h24v24H0z" fill="none"/>
			<path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.446z" />
		</svg>
	}
</button>
